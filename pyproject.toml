[project]
name = "hardware"
version = "0.1.0"
description = "Electronics component inventory with OCR-based ingestion"
readme = "README.md"
authors = [{ name = "Matias Ceau", email = "matias@ceau.net" }]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.4",
    "rich>=14.0.0",
    "types-requests>=2.32.4.20250611",
    "openai>=1.0.0",
    "argcomplete>=3.0.0",
    "pytest>=8.0.0",
    "pydantic>=2.11.7",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
]

[project.scripts]
hardware = "hardware:main"
hardware-inventory = "hardware.inventory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
